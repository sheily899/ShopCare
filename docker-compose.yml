services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - shopcare-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopcare-net

  chromadb:
    image: chromadb/chroma:0.5.23
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "8001:8000"
    volumes:
      - shopcare-chroma-data:/chroma/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v2/heartbeat')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - shopcare-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # 后端本地密钥与模型配置位于 backend/.env；敏感值只注入容器，不写入镜像。
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      CHROMA_PERSIST_DIRECTORY: /app/.data/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
      CUSTOMEROPS_KB_COLLECTION: knowledge_base_zh
      CUSTOMEROPS_EMBEDDING_MODEL: BAAI/bge-small-zh-v1.5
      CUSTOMEROPS_SKILLS_DIR: /app/skills
      CUSTOMEROPS_SKILLS_MAX_PROMPT_CHARS: "5000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PROMETHEUS_PORT: ${PROMETHEUS_PORT:-0}
      MONITOR_INTERVAL: ${MONITOR_INTERVAL:-10}
      CUSTOMEROPS_TOOL_TRACE_MAX: ${CUSTOMEROPS_TOOL_TRACE_MAX:-200}
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    networks:
      - shopcare-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Windows 常见 HTTP.sys 会占用宿主机 80；容器内仍固定监听 80，宿主端口可按环境覆盖。
      - "${SHOPCARE_FRONTEND_PORT:-8080}:80"
    networks:
      - shopcare-net

networks:
  shopcare-net:
    driver: bridge

volumes:
  shopcare-redis-data:
  shopcare-chroma-data:
